<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>徒手造心 · Heart Conjurer</title>
<style>
  :root {
    --ink: #f6edf7;
    --muted: rgba(246, 237, 247, .62);
    --dim: rgba(246, 237, 247, .38);
    --rose: #ff4f96;
    --rose-2: #ff8ac1;
    --cyan: #18efd8;
    --blue: #49b7ff;
    --panel: rgba(5, 12, 23, .68);
    --panel-strong: rgba(8, 13, 28, .86);
    --line: rgba(255, 137, 190, .22);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #02050b; }
  body {
    font-family: Inter, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
    cursor: crosshair;
  }

  #bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(900px 520px at 72% 38%, rgba(255, 45, 118, .32), transparent 66%),
      radial-gradient(720px 460px at 19% 66%, rgba(18, 214, 232, .15), transparent 68%),
      radial-gradient(1200px 720px at 58% 18%, rgba(106, 39, 103, .18), transparent 72%),
      linear-gradient(180deg, #02050b 0%, #050712 48%, #02050b 100%);
  }
  #bg::before,
  #bg::after {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
  }
  #bg::before {
    background:
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px),
      linear-gradient(0deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(70% 62% at 50% 45%, rgba(0,0,0,.5), transparent 78%);
    opacity: .22;
  }
  #bg::after {
    background:
      radial-gradient(70% 34% at 50% 96%, rgba(255, 58, 132, .18), transparent 70%),
      linear-gradient(180deg, transparent 0 68%, rgba(0, 0, 0, .42) 100%);
  }

  #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; display: block; }

  #cameraPanel {
    position: fixed; z-index: 7; right: 32px; bottom: 196px;
    width: min(300px, 23vw); aspect-ratio: 4 / 3; overflow: hidden;
    border-radius: 22px; border: 1px solid rgba(129, 180, 255, .22);
    background:
      linear-gradient(180deg, rgba(9, 17, 31, .82), rgba(3, 7, 15, .92)),
      radial-gradient(80% 80% at 50% 40%, rgba(255, 79, 150, .14), transparent 72%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.03), 0 22px 70px rgba(0,0,0,.42);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  }
  #cameraPanel.hidden { opacity: 0; transform: translateY(12px); pointer-events: none; }
  #cam, #handPreview {
    position: absolute; inset: 0; width: 100%; height: 100%;
  }
  #cam {
    object-fit: cover; transform: scaleX(-1);
    opacity: 0; transition: opacity .35s ease;
    pointer-events: none; filter: saturate(1.08) contrast(1.08);
  }
  #cameraPanel.connected #cam { opacity: .9; }
  #handPreview { pointer-events: none; }
  .camera-head {
    position: absolute; z-index: 2; left: 12px; right: 12px; top: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 11px; letter-spacing: .1em; color: rgba(246,237,247,.78);
    text-shadow: 0 1px 8px rgba(0,0,0,.65);
  }
  .camera-head b { color: #8af7ff; font-weight: 680; }
  .camera-distance {
    position: absolute; z-index: 2; left: 12px; right: 12px; bottom: 10px;
    min-height: 26px; display: none; align-items: center; justify-content: center;
    border-radius: 999px; border: 1px solid rgba(129, 180, 255, .18);
    background: rgba(4, 8, 18, .58);
    color: rgba(246, 237, 247, .78);
    font-size: 11px; letter-spacing: .08em; text-shadow: 0 1px 8px rgba(0,0,0,.7);
  }
  #cameraPanel.connected .camera-distance { display: flex; }
  #cameraPanel[data-distance="ok"] .camera-distance { color: #8af7ff; border-color: rgba(24, 239, 216, .36); }
  #cameraPanel[data-distance="close"],
  #cameraPanel[data-distance="edge"] { border-color: rgba(255, 137, 190, .36); }
  #cameraPanel[data-distance="close"] .camera-distance,
  #cameraPanel[data-distance="edge"] .camera-distance {
    color: #ffd8ec; border-color: rgba(255, 137, 190, .5);
    background: rgba(57, 12, 38, .54);
  }
  #cameraPanel[data-distance="far"] .camera-distance { color: #cdefff; border-color: rgba(129, 180, 255, .42); }
  .camera-empty {
    position: absolute; inset: 0; display: grid; place-items: center;
    padding: 28px; text-align: center; color: var(--dim);
    font-size: 13px; line-height: 1.7; letter-spacing: .08em;
  }
  #cameraPanel.connected .camera-empty { display: none; }

  #vignette {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background:
      radial-gradient(90% 86% at 54% 42%, transparent 42%, rgba(2,5,11,.52) 78%, rgba(0,0,0,.88) 100%),
      linear-gradient(180deg, rgba(0,0,0,.28) 0%, transparent 24%, transparent 58%, rgba(0,0,0,.42) 100%);
    mix-blend-mode: multiply;
  }

  #status {
    position: fixed; z-index: 5; top: 28px; right: 32px;
    min-height: 48px; display: flex; align-items: center; gap: 16px;
    font-size: 14px; letter-spacing: .06em; color: rgba(255,255,255,.9);
    background: rgba(6, 12, 24, .7); border: 1px solid rgba(134, 189, 255, .22);
    padding: 10px 18px; border-radius: 999px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.03), 0 18px 48px rgba(0,0,0,.28);
  }
  #status::before {
    content: ""; width: 14px; height: 14px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 18px rgba(24, 239, 216, .9);
  }
  #status b { color: #8af7ff; font-weight: 680; }

  #mode {
    display: grid; gap: 10px; justify-items: center; align-content: center;
    min-width: 260px; color: var(--ink);
  }
  #mode span {
    font-size: clamp(26px, 3vw, 38px); font-weight: 760; letter-spacing: .18em;
    color: #ffe0ee; text-shadow: 0 0 20px rgba(255, 88, 155, .55);
    white-space: nowrap;
  }
  #mode::before {
    content: "当前模式";
    font-size: 12px; letter-spacing: .18em; color: var(--rose-2);
  }
  #mode::after {
    content: ""; width: min(340px, 70vw); height: 22px;
    background:
      radial-gradient(circle at 50% 50%, var(--rose-2) 0 6px, transparent 7px),
      linear-gradient(90deg, transparent 0%, rgba(255,79,150,.8) 42%, rgba(255,79,150,.8) 58%, transparent 100%);
    mask-image: linear-gradient(90deg, transparent, #000 16%, #000 84%, transparent);
    opacity: .86;
  }

  #legend {
    position: fixed; z-index: 5; left: 32px; top: 32px;
    width: 252px; padding: 18px 16px; border-radius: 22px;
    background: var(--panel); border: 1px solid rgba(129, 180, 255, .18);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    font-size: 12px; color: rgba(246, 237, 247, .84);
    transition: opacity .4s ease, transform .4s ease;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.025), 0 20px 60px rgba(0,0,0,.34);
  }
  #legend.hidden { opacity: 0; transform: translateY(12px); pointer-events: none; }
  #legend h3 { font-size: 13px; letter-spacing: .16em; color: #fff2f8; margin-bottom: 14px; font-weight: 680; }
  #legend .row { display: grid; grid-template-columns: 50px 50px 1fr; gap: 10px; align-items: center; min-height: 58px; padding: 10px 0; border-top: 1px solid rgba(255,255,255,.06); }
  #legend .row:first-of-type { border-top: 0; }
  #legend .row .k { color: #ff9fc8; font-weight: 680; }
  #legend .row span:last-child { color: var(--muted); line-height: 1.45; }
  .gesture-icon {
    width: 48px; height: 48px; display: block;
    border-radius: 15px; overflow: hidden;
    background:
      radial-gradient(circle at 50% 48%, rgba(255, 91, 166, .16), rgba(10, 12, 25, .72) 70%),
      rgba(8, 12, 24, .72);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.03), -3px 0 12px rgba(31, 239, 229, .1), 3px 0 14px rgba(255, 79, 150, .14);
  }
  .gesture-icon img { width: 100%; height: 100%; display: block; object-fit: cover; }
  #legend .hint { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.07); font-size: 11px; line-height: 1.6; color: var(--dim); }

  #telemetry {
    position: fixed; z-index: 5; left: 32px; top: 576px;
    width: 230px; padding: 16px; border-radius: 20px;
    background: var(--panel); border: 1px solid rgba(129, 180, 255, .18);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.025), 0 20px 60px rgba(0,0,0,.34);
  }
  #telemetry h3 { font-size: 13px; letter-spacing: .12em; color: #fff2f8; margin-bottom: 12px; }
  .meter-row { display: grid; grid-template-columns: 58px 1fr 42px; align-items: center; gap: 10px; padding: 7px 0; font-size: 11px; color: var(--muted); }
  .meter {
    height: 2px; border-radius: 99px; overflow: hidden;
    background: rgba(255,255,255,.08);
  }
  .meter i {
    display: block; width: var(--v, 52%); height: 100%; border-radius: inherit;
    background: linear-gradient(90deg, var(--cyan), var(--rose));
    box-shadow: 0 0 12px rgba(255, 79, 150, .6);
  }
  .meter-row b { color: rgba(255,255,255,.82); font-weight: 560; text-align: right; }

  #console {
    position: fixed; z-index: 8; left: 28px; right: 28px; bottom: 24px;
    min-height: 156px; display: grid; grid-template-columns: minmax(280px, .92fr) minmax(300px, 1fr) minmax(400px, 1.42fr);
    align-items: stretch; gap: 18px; padding: 22px 24px;
    background:
      linear-gradient(180deg, rgba(10, 18, 32, .82), rgba(4, 8, 18, .92)),
      radial-gradient(70% 120% at 50% 0%, rgba(255, 74, 145, .14), transparent 64%);
    border: 1px solid rgba(129, 180, 255, .2); border-radius: 30px;
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 0 rgba(255, 79, 150, .24), 0 28px 80px rgba(0,0,0,.46);
  }
  #console::before,
  #console::after {
    content: ""; position: absolute; left: 26px; right: 26px; height: 1px; pointer-events: none;
    background: linear-gradient(90deg, transparent, rgba(255,79,150,.82), transparent);
  }
  #console::before { top: 8px; opacity: .22; }
  #console::after { bottom: 9px; opacity: .46; }
  .entry-actions, .mode-actions {
    display: flex; align-items: center; gap: 12px;
  }
  .entry-actions { min-width: 0; }
  .mode-actions {
    justify-content: end; padding: 0 2px;
    border-radius: 18px; overflow: hidden;
    background: rgba(3, 8, 18, .42); border: 1px solid rgba(255,255,255,.07);
  }
  button {
    font: inherit; color: var(--ink); cursor: pointer;
    min-height: 64px; border-radius: 18px; border: 1px solid rgba(255, 142, 194, .28);
    background: rgba(10, 17, 31, .72);
    transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
  }
  button:hover { transform: translateY(-1px); border-color: rgba(255, 142, 194, .62); box-shadow: 0 0 36px rgba(255, 79, 150, .18); }
  button:focus-visible { outline: 2px solid rgba(24, 239, 216, .8); outline-offset: 3px; }
  button:disabled { cursor: wait; opacity: .72; transform: none; }
  #btnCam {
    flex: 1; padding: 0 18px; font-size: 17px; font-weight: 680; letter-spacing: .06em;
  }
  #btnCam {
    background: linear-gradient(180deg, rgba(255,79,150,.92), rgba(122, 21, 63, .82));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), 0 0 36px rgba(255,79,150,.28);
  }
  .mode-button {
    flex: 1; min-width: 72px; min-height: 102px; border: 0; border-radius: 0;
    display: grid; place-items: center; gap: 8px; padding: 12px 10px;
    background: transparent; color: var(--muted); border-left: 1px solid rgba(255,255,255,.07);
  }
  .mode-button:first-child { border-left: 0; }
  .mode-button .key { font-size: 12px; color: var(--dim); letter-spacing: .1em; }
  .mode-button .name { font-size: 16px; font-weight: 650; letter-spacing: .08em; }
  .mode-button.active {
    color: #fff2f8;
    background: linear-gradient(180deg, rgba(255,79,150,.24), rgba(255,79,150,.08));
    box-shadow: inset 0 0 0 1px rgba(255, 142, 194, .5), 0 0 30px rgba(255,79,150,.2);
    border-radius: 16px;
  }

  .privacy {
    position: fixed; z-index: 9; left: 50%; bottom: 8px; transform: translateX(-50%);
    font-size: 11px; letter-spacing: .08em; color: rgba(246,237,247,.32);
    pointer-events: none; white-space: nowrap;
  }

  #toast {
    position: fixed; z-index: 30; top: 90px; left: 50%; transform: translateX(-50%) translateY(-12px);
    background: rgba(6, 12, 24, .78); border: 1px solid rgba(255,150,220,.26); color: #ffe3f4;
    padding: 11px 18px; border-radius: 999px; font-size: 13px; letter-spacing: .06em;
    opacity: 0; transition: opacity .35s ease, transform .35s ease; pointer-events: none;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 960px) {
    #status { top: 18px; right: 18px; min-height: 38px; font-size: 12px; padding: 8px 12px; }
    #cameraPanel { right: 12px; bottom: 324px; width: 160px; border-radius: 16px; }
    .camera-head { top: 7px; left: 9px; right: 9px; font-size: 9px; }
    .camera-distance { left: 9px; right: 9px; bottom: 7px; min-height: 22px; font-size: 9px; }
    .camera-empty { padding: 18px; font-size: 10px; }
    #legend, #telemetry { display: none; }
    #console {
      left: 12px; right: 12px; bottom: 14px; min-height: 0;
      grid-template-columns: 1fr; gap: 12px; padding: 14px; border-radius: 24px;
    }
    .entry-actions { order: 2; }
    #mode { order: 1; min-width: 0; }
    #mode span { font-size: 24px; }
    .mode-actions { order: 3; overflow: hidden; justify-content: stretch; }
    .mode-button { min-width: 0; min-height: 74px; padding: 10px 6px; }
    .mode-button .name { font-size: 14px; }
    .privacy { display: none; }
  }
</style>
</head>
<body>
  <div id="bg"></div>
  <canvas id="scene"></canvas>
  <div id="cameraPanel">
    <video id="cam" playsinline muted></video>
    <canvas id="handPreview"></canvas>
    <div class="camera-head"><span>识别预览</span><b id="cameraState">待连接</b></div>
    <div class="camera-empty">开启摄像头后，这里会显示实时画面和手部关键点</div>
    <div id="distanceHint" class="camera-distance">手放入预览框</div>
  </div>
  <div id="vignette"></div>

  <div id="status">准备识别 · <b>低延迟</b></div>

  <div id="legend">
    <h3>手势映射</h3>
    <div class="row">
      <span class="gesture-icon" aria-hidden="true"><img src="assets/gestures/heart.png?v=2" alt=""></span>
      <span class="k">比心</span><span>心形盛放</span>
    </div>
    <div class="row">
      <span class="gesture-icon" aria-hidden="true"><img src="assets/gestures/doubleheart.png?v=2" alt=""></span>
      <span class="k">双比心</span><span>并排双心</span>
    </div>
    <div class="row">
      <span class="gesture-icon" aria-hidden="true"><img src="assets/gestures/point.png?v=2" alt=""></span>
      <span class="k">食指</span><span>群心追指尖</span>
    </div>
    <div class="row">
      <span class="gesture-icon" aria-hidden="true"><img src="assets/gestures/gun.png?v=2" alt=""></span>
      <span class="k">手枪</span><span>丘比特箭</span>
    </div>
    <div class="row">
      <span class="gesture-icon" aria-hidden="true"><img src="assets/gestures/palm.png?v=2" alt=""></span>
      <span class="k">手掌</span><span>散开</span>
    </div>
    <div class="row">
      <span class="gesture-icon" aria-hidden="true"><img src="assets/gestures/fist.png?v=2" alt=""></span>
      <span class="k">拳头</span><span>聚合</span>
    </div>
    <div class="hint">快捷键：H 隐藏说明 · V 预览 · M 心跳音</div>
  </div>

  <div id="telemetry">
    <h3>实时数据</h3>
    <div class="meter-row"><span>速度</span><div class="meter"><i id="mSpeed"></i></div><b id="vSpeed">0.0</b></div>
    <div class="meter-row"><span>轨迹强度</span><div class="meter"><i id="mOrbit"></i></div><b id="vOrbit">48%</b></div>
    <div class="meter-row"><span>粒子密度</span><div class="meter"><i id="mDensity"></i></div><b id="vDensity">62%</b></div>
    <div class="meter-row"><span>心能量</span><div class="meter"><i id="mHeart"></i></div><b id="vHeart">0%</b></div>
    <div class="meter-row"><span>帧率</span><div class="meter"><i id="mFps"></i></div><b id="vFps">60</b></div>
  </div>

  <div id="console">
    <div class="entry-actions">
      <button id="btnCam">开启摄像头</button>
    </div>
    <div id="mode"><span>让指尖起舞</span></div>
    <div class="mode-actions" aria-label="模式切换">
      <button class="mode-button" data-mode="rose"><span class="key">1</span><span class="name">心形</span></button>
      <button class="mode-button" data-mode="doubleheart"><span class="key">2</span><span class="name">双心</span></button>
      <button class="mode-button" data-mode="arrow"><span class="key">3</span><span class="name">箭</span></button>
      <button class="mode-button" data-mode="galaxy"><span class="key">4</span><span class="name">散开</span></button>
      <button class="mode-button" data-mode="gather"><span class="key">5</span><span class="name">聚合</span></button>
    </div>
  </div>

  <div class="privacy">摄像头画面仅在本机浏览器中处理，不会上传</div>

  <div id="toast"></div>

<script type="module">
/* =========================================================================
   徒手造心 · Heart Conjurer
   - 手势识别：MediaPipe Tasks HandLandmarker (运行库 CDN，模型本地加载)
   - 渲染：Canvas2D 预渲染发光爱心精灵 + 叠加混合 + 拖尾余晖
   - 摄像头体验为主：手势直接驱动画面
   ========================================================================= */

const TASKS_CDN = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18";
const WASM_CDN  = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm";
const MODEL_URL = "assets/mediapipe/hand_landmarker.task";

// ---------- DOM ----------
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d', { alpha: false });
const video = document.getElementById('cam');
const cameraPanel = document.getElementById('cameraPanel');
const previewCanvas = document.getElementById('handPreview');
const previewCtx = previewCanvas.getContext('2d');
const cameraState = document.getElementById('cameraState');
const distanceHint = document.getElementById('distanceHint');
const elStatus = document.getElementById('status');
const elMode = document.getElementById('mode').querySelector('span');
const elLegend = document.getElementById('legend');
const elToast = document.getElementById('toast');
const btnCam = document.getElementById('btnCam');
const modeButtons = [...document.querySelectorAll('[data-mode]')];
const meterEls = {
  speed: [document.getElementById('mSpeed'), document.getElementById('vSpeed')],
  orbit: [document.getElementById('mOrbit'), document.getElementById('vOrbit')],
  density: [document.getElementById('mDensity'), document.getElementById('vDensity')],
  heart: [document.getElementById('mHeart'), document.getElementById('vHeart')],
  fps: [document.getElementById('mFps'), document.getElementById('vFps')],
};

let W = 0, H = 0, MIN = 0, MAX = 0;
const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
function resize() {
  W = window.innerWidth; H = window.innerHeight; MIN = Math.min(W, H); MAX = Math.max(W, H);
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const rect = previewCanvas.getBoundingClientRect();
  previewCanvas.width = Math.max(1, Math.floor(rect.width * DPR));
  previewCanvas.height = Math.max(1, Math.floor(rect.height * DPR));
  previewCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- helpers ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b = 0) => b + Math.random() * (a - b);
function toast(msg, ms = 2600) {
  elToast.textContent = msg; elToast.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => elToast.classList.remove('show'), ms);
}
function status(html) { elStatus.innerHTML = html; }

// =========================================================================
//  发光爱心精灵 —— 预渲染若干色相，渲染时只做 drawImage，性能友好
// =========================================================================
const PALETTE = [344, 338, 330, 324, 352, 4, 14, 190, 200, 182, 318, 306, 28, 210];
const sprites = PALETTE.map(makeSprite);

function heartPath(c, s) {
  c.beginPath();
  for (let t = 0; t <= TAU + 0.05; t += 0.12) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    const px = x / 16 * s, py = -y / 16 * s;
    t === 0 ? c.moveTo(px, py) : c.lineTo(px, py);
  }
  c.closePath();
}
function makeSprite(hue) {
  const S = 80, cv = document.createElement('canvas');

    pointerField.speed = lerp(pointerField.speed, speed, 0.22);

  } else {

  const density = mode === 'galaxy' ? 92 : mode === 'gather' ? 68 : 62 + beat * 18;

  setMeter('orbit', orbit, Math.round(orbit) + '%');
  setMeter('density', density, Math.round(density) + '%');
  setMeter('heart', beat * 100, Math.round(beat * 100) + '%');

  const h0 = hands[0];
  const handCenter = h0 ? h0.stagePalmCenter : center;
  if (mode === 'rose')        { Object.assign(center, handCenter); scale = MIN * 0.27 * (0.94 + 0.06*beat); angle = Math.sin(t * 0.18) * 0.08; }
  else if (mode === 'arrow')  { Object.assign(center, handCenter); scale = MIN * 0.19; angle = h0 ? h0.stageDir : -0.5; }
  else if (mode === 'gather') { Object.assign(center, handCenter); scale = MIN * 0.1 * (0.6 + 0.4*beat); }
  else if (mode === 'doubleheart') {
    if (hands.length >= 2) {
      center.x = (hands[0].stagePalmCenter.x + hands[1].stagePalmCenter.x) / 2;
      center.y = (hands[0].stagePalmCenter.y + hands[1].stagePalmCenter.y) / 2;
    } else Object.assign(center, handCenter);
    scale = MIN * 0.19 * (0.4 + 0.6*bloom);
  }
  else if (mode === 'galaxy') { scale = MIN * 0.34 * (0.5 + 0.5*bloom); angle = t * 0.05; }
  else if (mode === 'idle')   { scale = MIN * 0.27 * (0.94 + 0.06*beat); angle = Math.sin(t * 0.18) * 0.08; }

  // 追随用的指尖（可多个）
  const pointers = hands.length ? hands.map(h => h.stageIndexTip) : [];
  syncControlSurface(dt, beat, pointers);

  // —— 更新粒子 ——
  const shape = mode === 'idle' ? SHAPES.heartfield : SHAPES[mode];
  const ca = Math.cos(angle), sa = Math.sin(angle);
  for (let i = 0; i < COUNT; i++) {
    const p = ps[i];
    if (shape) {                                   // 阵型：弹向目标点
      const b = shape[i]; const bx = b[0] + p.jx, by = b[1] + p.jy;
      const rx = bx * ca - by * sa, ry = bx * sa + by * ca;
      const txp = center.x + rx * scale, typ = center.y + ry * scale;
      const k = mode === 'galaxy' ? 0.04 : 0.075;
      p.vx += (txp - p.x) * k; p.vy += (typ - p.y) * k;
      p.vx *= 0.82; p.vy *= 0.82;
    } else if (pointers.length) {                  // 追随指尖：心场被指尖牵引
      let best = pointers[0], bd = 1e18;
      for (const pt of pointers) { const d = (pt.x-p.x)**2 + (pt.y-p.y)**2; if (d < bd) { bd = d; best = pt; } }
      if (mode === 'chase' && i < COUNT * 0.68) {
        const b = SHAPES.heartfield[i];
        const attractor = chaseAttractor(best);
        const txp = attractor.x + b[0] * MIN * 0.19;
        const typ = attractor.y + b[1] * MIN * 0.19;
        const k = 0.04 + p.follow * 0.025;
        p.vx += (txp - p.x) * k; p.vy += (typ - p.y) * k;
        p.vx *= 0.86; p.vy *= 0.86;
      } else {
        p.orbA += 0.04 + p.follow * 0.05;
        const pr = p.orbR * (0.55 + 0.45 * Math.sin(t * 1.6 + p.tw));
        const txp = best.x + Math.cos(p.orbA) * pr, typ = best.y + Math.sin(p.orbA) * pr;
        const k = 0.02 + p.follow * 0.06;
        p.vx += (txp - p.x) * k; p.vy += (typ - p.y) * k;
        p.vx += -(typ - p.y) * 0.0016; p.vy += (txp - p.x) * 0.0016; // 涡旋
        p.vx *= 0.9; p.vy *= 0.9;
      }
    } else {                                        // 待机：余烬般上升
      p.vy -= 0.03; p.vx += Math.sin(t * 0.6 + p.tw) * 0.02;
      p.vx *= 0.985; p.vy *= 0.985;
    }
    p.x += p.vx * f; p.y += p.vy * f;
    if (!shape && !pointers.length) {               // 待机环绕
      if (p.y < -30) { p.y = H + 30; p.x = rand(W); }
      if (p.x < -30) p.x = W + 30; else if (p.x > W + 30) p.x = -30;
    }
  }

  render(t, beat, center, pointers, scale);
  requestAnimationFrame(frame);
}

// =========================================================================
//  渲染
// =========================================================================
const hueShiftRate = 0.7;
const HC = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
            [9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];

function renderHeartAura(t, beat, center, scale) {
  ctx.save();
  ctx.translate(center.x, center.y);
  ctx.rotate(Math.sin(t * 0.18) * 0.04);
  ctx.globalCompositeOperation = 'lighter';
  ctx.shadowColor = 'rgba(255, 76, 144, .72)';
  ctx.shadowBlur = 22;
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = `rgba(255, 154, 202, ${0.18 + beat * 0.12})`;
  heartPath(ctx, scale * (1.02 + beat * 0.025));
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(24, 239, 216, .12)';
  heartPath(ctx, scale * 1.08);
  ctx.stroke();
  ctx.restore();
}

function renderEnergyRibbons(t, beat, center, scale) {
  ctx.save();
  ctx.translate(center.x, center.y);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 7; i++) {
    const r = scale * (0.72 + i * 0.12);
    const start = t * (0.12 + i * 0.01) + i * 0.72;
    const span = Math.PI * (0.75 + 0.18 * Math.sin(t * 0.4 + i));
    ctx.save();
    ctx.rotate(-0.28 + i * 0.105 + Math.sin(t * 0.15 + i) * 0.04);
    ctx.scale(1.48 + i * 0.035, 0.34 + i * 0.018);
    ctx.beginPath();
    ctx.arc(0, 0, r, start, start + span);
    ctx.strokeStyle = i % 3 === 1 ? 'rgba(24, 239, 216, .18)' : `rgba(255, 77, 146, ${0.18 - i * 0.012 + beat * 0.04})`;
    ctx.lineWidth = i % 2 ? 1.2 : 1.8;
    ctx.shadowColor = i % 3 === 1 ? 'rgba(24, 239, 216, .45)' : 'rgba(255, 77, 146, .55)';
    ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function renderPointerField(t, beat, center, pointers) {
  if (!pointers.length && pointerField.trail.length < 2) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (pointerField.trail.length > 1) {
    ctx.beginPath();
    pointerField.trail.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.strokeStyle = 'rgba(24,239,216,0.34)';
    ctx.lineWidth = 2.2;
    ctx.shadowColor = 'rgba(24,239,216,.65)';
    ctx.shadowBlur = 14;
    ctx.stroke();
  }
  for (const pt of pointers) {
    const attractor = mode === 'chase' ? chaseAttractor(pt) : center;
    ctx.globalAlpha = .32;
    ctx.strokeStyle = 'rgba(24,239,216,.62)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(pt.x, pt.y);
    ctx.quadraticCurveTo((pt.x + attractor.x) / 2, pt.y - MIN * .08, attractor.x, attractor.y);
    ctx.stroke();
    ctx.globalAlpha = .42;
    ctx.shadowColor = 'rgba(255,79,150,.62)';
    ctx.shadowBlur = 14;
    ctx.fillStyle = 'rgba(255,245,250,.92)';
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 2.8 + beat * 1.2, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function render(t, beat, center, pointers, scale) {
  const visualCenter = mode === 'chase' && pointers[0] ? chaseAttractor(pointers[0]) : center;
  const visualScale = mode === 'chase' ? MIN * 0.19 : scale;
  // 拖尾：半透明覆盖而非清屏
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(7,3,15,0.12)';
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';

  // 非心形模式保留轻柔能量底，心形/双心避免出现圆形靶心感。
  if (mode !== 'rose' && mode !== 'doubleheart') {
    const haloHue = 330 + 24 * Math.sin(t * 0.2);
    const hg = glowSprite(Math.round(haloHue));
    const R = MIN * (0.16 + 0.06 * beat);
    ctx.globalAlpha = 0.14 + 0.12 * beat;
    ctx.drawImage(hg, visualCenter.x - R, visualCenter.y - R, R*2, R*2);
  }
  if (mode === 'chase' || mode === 'idle' || mode === 'rose' || mode === 'galaxy') renderEnergyRibbons(t, beat, visualCenter, visualScale);
  if (mode === 'chase' || mode === 'idle' || mode === 'rose') renderHeartAura(t, beat, visualCenter, visualScale);

  // 指尖柔光
  ctx.globalAlpha = 0.42;
  const pg = glowSprite(322);
  for (const pt of pointers) { const r = 54; ctx.drawImage(pg, pt.x - r, pt.y - r, r*2, r*2); }
  renderPointerField(t, beat, center, pointers);

  // 霓虹手骨架
  if (hands.length) {
    ctx.globalAlpha = 0.55; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.strokeStyle = `hsla(${Math.round(316 + 20*Math.sin(t))},100%,76%,0.5)`;
    ctx.shadowColor = 'rgba(255,120,200,0.8)'; ctx.shadowBlur = 8;
    for (const h of hands) {
      ctx.beginPath();
      const pts = h.stagePts;
      for (const [a, b] of HC) { ctx.moveTo(pts[a].x, pts[a].y); ctx.lineTo(pts[b].x, pts[b].y); }
      ctx.stroke();
      for (const pt of pts) { ctx.beginPath(); ctx.arc(pt.x, pt.y, 2.1, 0, TAU); ctx.fillStyle = 'rgba(255,220,245,0.85)'; ctx.fill(); }
    }
    ctx.shadowBlur = 0;
  }

  // 群心
  const shift = Math.floor(t * hueShiftRate);
  const sizeMul = 1 + 0.16 * beat;
  const twinkle = (mode === 'galaxy' || mode === 'idle');
  for (let i = 0; i < COUNT; i++) {
    const p = ps[i];
    const sp = sprites[(p.hi + shift) % sprites.length];
    let a = p.alpha;
    if (twinkle && p.field) a *= 0.4 + 0.6 * Math.abs(Math.sin(t * 2.2 + p.tw));
    const s = p.size * sizeMul;
    ctx.globalAlpha = a;
    ctx.drawImage(sp, p.x - s/2, p.y - s/2, s, s);
  }

  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

// =========================================================================
let audio = null, audioOn = false, lastBeatLevel = 0;
function ensureAudio() { if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} } }
function thump() {
  if (!audioOn || !audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(72, audio.currentTime);
  o.frequency.exponentialRampToValueAtTime(40, audio.currentTime + 0.18);
  g.gain.setValueAtTime(0.0001, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.22, audio.currentTime + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.22);
  o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.24);
}
// 心跳触发音效
setInterval(() => {
  const lvl = heartbeat(performance.now() / 1000);
  if (lvl > 0.6 && lastBeatLevel <= 0.6) thump();
  lastBeatLevel = lvl;
}, 16);

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'h') elLegend.classList.toggle('hidden');
  else if (k === 'v') cameraPanel.classList.toggle('hidden');
  else if (k === 'm') { ensureAudio(); audioOn = !audioOn; if (audioOn && audio.state === 'suspended') audio.resume(); toast(audioOn ? '心跳音 · 开' : '心跳音 · 关'); }
});

function enter() {
  ensureAudio(); if (audio && audio.state === 'suspended') audio.resume();
}
btnCam.addEventListener('click', () => { enter(); startCamera(); });

// 启动渲染（即使未点开始也先把背景星河点亮）
requestAnimationFrame(frame);
status('准备识别 · <b>低延迟</b>');
if ('requestIdleCallback' in window) requestIdleCallback(warmupHandAssets, { timeout: 1200 });
else setTimeout(warmupHandAssets, 800);
</script>
